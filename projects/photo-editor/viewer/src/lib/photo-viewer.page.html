<ion-header
  [translucent]="true"
  [class.photo-editor-header-buttons-dark]="toolbarColorScheme() === 'dark'"
  [class.photo-editor-header-buttons-light]="toolbarColorScheme() === 'light'"
  [style.color-scheme]="toolbarColorScheme()"
>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button [attr.aria-label]="dictionary().close" (click)="modalCtrl.dismiss()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    @if (enableDelete() && imageUrls().length > 0) {
    <ion-buttons slot="end">
      <ion-button color="photo-editor-danger" fill="solid" type="submit" (click)="remove()">{{ dictionary().delete }}</ion-button>
    </ion-buttons>
    }
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <swiper-container #swiper>
    @for (url of imageUrls(); track $index; let index = $index) {
    <swiper-slide>
      <div class="swiper-zoom-container"><img [src]="url" [alt]="resolveImageAlt(url, index)" [class.circle]="isCircle()" /></div>
    </swiper-slide>
    }
  </swiper-container>
</ion-content>

@if (enableFooterSafeArea()) {
<!-- use for safe area-->
<ion-footer>
  <ion-toolbar style="--border-width: 0; --min-height: 0"></ion-toolbar>
</ion-footer>
}
